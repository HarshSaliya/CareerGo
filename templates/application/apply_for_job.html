<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" value="{{ initial_data.name }}" required><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="{{ initial_data.email }}" required><br>

    <label for="phone">Phone:</label>
    <input type="text" id="phone" name="phone" value="{{ initial_data.phone }}" required><br>

    {% if initial_data.resume %}
        <p>Using your existing resume: {{ initial_data.resume.name }}</p>
    {% else %}
        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume" required><br>
    {% endif %}

    <label for="cover_letter">Cover Letter:</label>
    <textarea id="cover_letter" name="cover_letter"></textarea><br>

    <label for="portfolio_url">Portfolio URL:</label>
    <input type="url" id="portfolio_url" name="portfolio_url"><br>

    <label for="linkedin_profile">LinkedIn Profile:</label>
    <input type="url" id="linkedin_profile" name="linkedin_profile"><br>

    <label for="github_profile">GitHub Profile:</label>
    <input type="url" id="github_profile" name="github_profile"><br>

    <label for="expected_salary">Expected Salary:</label>
    <input type="number" id="expected_salary" name="expected_salary"><br>

    <label for="available_start_date">Available Start Date:</label>
    <input type="date" id="available_start_date" name="available_start_date"><br>

    <button type="submit">Apply</button>
</form>
