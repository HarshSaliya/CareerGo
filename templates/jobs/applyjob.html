{% extends 'base.html' %}
{% block title %} Application Form {% endblock %}

{% load static %}

{% block content %}
<div class="container py-5">
  <h1 class="text-center py-4">Apply for {{ job.title }}</h1>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <form action="{% url 'application' %}" method="POST" enctype="multipart/form-data" class="p-4 border rounded bg-light">
        {% csrf_token %}
        
        <!-- Hidden Fields -->
        {% if user.is_authenticated %}
          <input type="hidden" name="user_id" value="{{ user.id }}">
        {% endif %}
        <input type="hidden" name="job_id" value="{{ job.id }}">

        <!-- Job Title (Readonly) -->
        <div class="form-group">
          <label for="job_name" class="col-form-label">Job Title:</label>
          <input type="text" name="job" class="form-control" value="{{ job.title }}" readonly>
        </div>

        <!-- Name -->
        <div class="form-group">
          <label for="name" class="col-form-label">Full Name:</label>
          <input type="text" name="name" class="form-control" 
            {% if user.is_authenticated %}
              value="{{ user.first_name }} {{ user.last_name }}"
            {% endif %}
            required>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="col-form-label">Email:</label>
          <input type="email" name="email" class="form-control" 
            {% if user.is_authenticated %}
              value="{{ user.email }}"
            {% endif %}
            required>
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label for="phone" class="col-form-label">Phone:</label>
          <input type="tel" 
                 name="phone" 
                 class="form-control" 
                 placeholder="Enter your phone number"
                 maxlength="13" 
                 minlength="10" 
                 title="Phone number must be 10 digits and start with 6, 7, 8, or 9" 
                 required>
        </div>
        

        <!-- Resume Upload -->
        <div class="form-group">
          <label for="resume" class="col-form-label">Upload CV (PDF/DOCX)</label>
          <input type="file" name="resume" class="form-control-file" id="file" accept=".pdf,.doc,.docx" required>
        </div>

        <!-- Cover Letter -->
        <div class="form-group">
          <label for="cover_letter" class="col-form-label">Cover Letter:</label>
          <textarea name="cover_letter" class="form-control" rows="4" placeholder="Write a brief cover letter (optional)"></textarea>
        </div>

        <!-- Portfolio URL -->
        <div class="form-group">
          <label for="portfolio_url" class="col-form-label">Portfolio URL (optional):</label>
          <input type="url" name="portfolio_url" class="form-control" placeholder="https://your-portfolio.com">
        </div>

        <!-- LinkedIn Profile -->
        <div class="form-group">
          <label for="linkedin_profile" class="col-form-label">LinkedIn Profile (optional):</label>
          <input type="url" name="linkedin_profile" class="form-control" placeholder="https://linkedin.com/in/yourname">
        </div>

        <!-- GitHub Profile -->
        <div class="form-group">
          <label for="github_profile" class="col-form-label">GitHub Profile (optional):</label>
          <input type="url" name="github_profile" class="form-control" placeholder="https://github.com/yourusername">
        </div>

        <!-- Expected Salary -->
        <!-- Expected Salary -->
        <div class="form-group">
          <label for="expected_salary" class="col-form-label">Expected Salary (optional):</label>
          <input type="number" 
                name="expected_salary" 
                class="form-control" 
                placeholder="Enter expected salary"
                min="0" 
                step="1000"
                title="Salary must be a positive number (e.g., 30000)">
        </div>


        <!-- Available Start Date -->
        <div class="form-group">
          <label for="available_start_date" class="col-form-label">Available Start Date:</label>
          <input type="date" name="available_start_date" class="form-control" required  >
        </div>

        <hr>
        <button type="submit" class="btn btn-primary btn-block">Submit Application</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
