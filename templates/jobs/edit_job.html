{% extends 'base.html' %}

{% block title %}Edit Job{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4><i class="fas fa-edit"></i> Edit Job: {{ job.title }}</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                        {% csrf_token %}

                        <!-- Company Name -->
                        <div class="mb-3">
                            <label for="id_company" class="form-label"><i class="fas fa-building"></i> Company Name</label>
                            <input type="text" name="company" class="form-control" id="id_company" value="{{ job.company }}" placeholder="Enter company name" required>
                        </div>

                        <!-- Job Title -->
                        <div class="mb-3">
                            <label for="id_title" class="form-label"><i class="fas fa-briefcase"></i> Job Title</label>
                            <input type="text" name="title" class="form-control" id="id_title" value="{{ job.title }}" placeholder="Enter job title" required>
                        </div>

                        <!-- Role -->
                        <div class="mb-3">
                            <label for="id_role" class="form-label"><i class="fas fa-user-tie"></i> Role</label>
                            <input type="text" name="role" class="form-control" id="id_role" value="{{ job.role }}" placeholder="Enter job role" required>
                        </div>

                        <!-- Location -->
                        <div class="mb-3">
                            <label for="id_location" class="form-label"><i class="fas fa-map-marker-alt"></i> Location</label>
                            <select name="location" id="id_location" class="form-select" required>
                                <option value="" disabled>Select Location</option>
                                <option value="Mumbai" {% if job.location == "Mumbai" %}selected{% endif %}>Mumbai</option>
                                <option value="Bangalore" {% if job.location == "Bangalore" %}selected{% endif %}>Bangalore</option>
                                <option value="Pune" {% if job.location == "Pune" %}selected{% endif %}>Pune</option>
                                <option value="Remote" {% if job.location == "Remote" %}selected{% endif %}>Remote</option>
                            </select>
                        </div>

                        <!-- Job Description -->
                        <div class="mb-3">
                            <label for="id_description" class="form-label"><i class="fas fa-file-alt"></i> Job Description</label>
                            <textarea name="description" class="form-control" id="id_description" rows="3" required>{{ job.description }}</textarea>
                        </div>

                        <!-- About Company -->
                        <div class="mb-3">
                            <label for="id_about" class="form-label"><i class="fas fa-info-circle"></i> About the Company</label>
                            <textarea name="about" class="form-control" id="id_about" rows="3" required>{{ job.about }}</textarea>
                        </div>

                        <!-- Contract Type -->
                        <div class="mb-3">
                            <label for="id_contract" class="form-label"><i class="fas fa-file-contract"></i> Contract Type</label>
                            <select name="contract" id="id_contract" class="form-select" required>
                                <option value="Part Time" {% if job.contract == "Part Time" %}selected{% endif %}>Part Time</option>
                                <option value="Full Time" {% if job.contract == "Full Time" %}selected{% endif %}>Full Time</option>
                                <option value="Freelance" {% if job.contract == "Freelance" %}selected{% endif %}>Freelance</option>
                            </select>
                        </div>

                        <!-- Vacancy -->
                        <div class="mb-3">
                            <label for="id_vacancy" class="form-label"><i class="fas fa-users"></i> Number of Vacancies</label>
                            <input type="number" name="vacancy" class="form-control" id="id_vacancy" value="{{ job.vacancy }}" required>
                        </div>

                        <!-- Experience Required -->
                        <div class="mb-3">
                            <label for="id_experience" class="form-label"><i class="fas fa-briefcase"></i> Experience Required</label>
                            <input type="text" name="experience" class="form-control" id="id_experience" value="{{ job.experience }}" required>
                        </div>

                        <!-- Salary -->
                        <div class="mb-3">
                            <label for="id_salary" class="form-label"><i class="fas fa-money-bill-wave"></i> Salary (Annual in INR)</label>
                            <input type="number" name="salary" class="form-control" id="id_salary" value="{{ job.salary }}" required>
                        </div>

                        <!-- Deadline -->
                        <div class="mb-3">
                            <label for="id_deadline" class="form-label"><i class="fas fa-calendar-alt"></i> Application Deadline</label>
                            <input type="datetime-local" name="deadline" class="form-control" id="id_deadline" value="{{ job.deadline|date:'Y-m-d\TH:i' }}" required>
                        </div>

                        <!-- Job Image -->
                        <div class="mb-3">
                            <label for="id_main_image" class="form-label"><i class="fas fa-image"></i> Job Image</label>
                            <input type="file" name="main_image" class="form-control" id="id_main_image" accept="image/*" onchange="previewImage(event)">
                            {% if job.main_image %}
                            <div class="mt-3">
                                <img id="preview" src="{{ job.main_image.url }}" alt="Job image" class="img-fluid rounded shadow" style="max-width: 150px;">
                            </div>
                            {% else %}
                            <img id="preview" class="d-none img-fluid rounded shadow mt-3" style="max-width: 150px;">
                            {% endif %}
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> Save Changes</button>
                        </div>
                    </form>

                    <!-- Cancel Button -->
                    <div class="text-center mt-3">
                        <a href="{% url 'manage_jobs' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Preview Image Script -->
<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function () {
            const output = document.getElementById('preview');
            output.src = reader.result;
            output.classList.remove('d-none');
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>
{% endblock %}
