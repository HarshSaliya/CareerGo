{% extends 'base.html' %}
{% block content %}
{% csrf_token %}

<br>
<br>
<br>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-dark text-white text-center">
                    <h4><i class="fas fa-briefcase"></i> Post a New Job</h4>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                        {% csrf_token %}

                        <!-- Company Name -->
                        <div class="mb-3">
                            <label for="id_company" class="form-label">Company Name</label>
                            <input type="text" name="company" class="form-control" id="id_company" placeholder="Enter company name" required>
                        </div>

                        <!-- Job Title -->
                        <div class="mb-3">
                            <label for="id_title" class="form-label">Job Title</label>
                            <input type="text" name="title" class="form-control" id="id_title" placeholder="Enter job title" required>
                        </div>

                        <!-- Role -->
                        <div class="mb-3">
                            <label for="id_role" class="form-label">Role</label>
                            <input type="text" name="role" class="form-control" id="id_role" placeholder="Enter job role" required>
                        </div>

                        <!-- Location -->
                        <div class="mb-3">
                            <label for="id_location" class="form-label">Location</label>
                            <select name="location" id="id_location" class="form-select" required>
                                <option value="" selected disabled>Select Location</option>
                                <option value="Mumbai">Mumbai</option>
                                <option value="Bangalore">Bangalore</option>
                                <option value="Pune">Pune</option>
                                <option value="Remote">Remote</option>
                            </select>
                        </div>

                        <!-- Job Description -->
                        <div class="mb-3">
                            <label for="id_description" class="form-label">Job Description</label>
                            <textarea name="description" class="form-control" id="id_description" rows="3" placeholder="Add job description..." required></textarea>
                        </div>

                        <!-- About Company -->
                        <div class="mb-3">
                            <label for="id_about" class="form-label">About the Company</label>
                            <textarea name="about" class="form-control" id="id_about" rows="3" placeholder="Add details about the company..." required></textarea>
                        </div>

                        <!-- Contract Type -->
                        <div class="mb-3">
                            <label for="id_contract" class="form-label">Contract Type</label>
                            <select name="contract" id="id_contract" class="form-select" required>
                                <option value="" selected disabled>Select Contract Type</option>
                                <option value="Part Time">Part Time</option>
                                <option value="Full Time">Full Time</option>
                                <option value="Freelance">Freelance</option>
                            </select>
                        </div>

                        <!-- Vacancy -->
                        <div class="mb-3">
                            <label for="id_vacancy" class="form-label">Number of Vacancies</label>
                            <input type="number" name="vacancy" class="form-control" id="id_vacancy" placeholder="Enter number of vacancies" required>
                        </div>

                        <!-- Experience Required -->
                        <div class="mb-3">
                            <label for="id_experience" class="form-label">Experience Required</label>
                            <input type="text" name="experience" class="form-control" id="id_experience" placeholder="Enter required experience" required>
                        </div>

                        <!-- Salary -->
                        <div class="mb-3">
                            <label for="id_salary" class="form-label">Salary (Annual in INR)</label>
                            <input type="number" name="salary" class="form-control" id="id_salary" placeholder="Enter salary" required>
                        </div>

                        <!-- Deadline -->
                        <div class="mb-3">
                            <label for="id_deadline" class="form-label">Application Deadline</label>
                            <input type="datetime-local" name="deadline" class="form-control" id="id_deadline" required>
                        </div>

                        <!-- Job Image -->
                        <div class="mb-3">
                            <label for="id_main_image" class="form-label">Main Image</label>
                            <input type="file" name="main_image" class="form-control" id="id_main_image" accept="image/*" required>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg"><i class="fas fa-paper-plane"></i> Post Job</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
