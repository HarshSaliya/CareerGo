<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg p-4">
            <h2 class="text-center mb-4">Upload Your Resume for ATS Analysis</h2>
            <form id="resumeForm" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Name:</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email:</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Profession:</label>
                    <select name="profession" class="form-select">
                        <option value="Python Backend">Python Backend</option>
                        <option value="Java Backend">Java Backend</option>
                        <option value="Data Science">Data Science</option>
                        <option value="PHP">PHP</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Experience Level:</label>
                    <select name="experience_level" class="form-select">
                        <option value="Fresher">Fresher</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Experienced">Experienced</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Upload Resume (PDF/DOCX):</label>
                    <input type="file" name="resume_file" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Upload & Check</button>
            </form>
            <hr>
            <h3 id="score" class="text-center mt-3"></h3>
            <p id="feedback" class="text-center text-muted"></p>
        </div>
    </div>

    <script>
        document.getElementById("resumeForm").addEventListener("submit", function(event) {
            event.preventDefault();
            let formData = new FormData(this);
            fetch("{% url 'process_resume' %}", {
                method: "POST",
                body: formData,
                headers: { "X-Requested-With": "XMLHttpRequest" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("feedback").innerHTML = `<p class='text-danger'>${data.error}</p>`;
                } else {
                    document.getElementById("score").innerText = `Resume Score: ${data.score}/100`;
                    document.getElementById("feedback").innerText = data.feedback;
                }
            })
            .catch(error => console.error("Error:", error));
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
