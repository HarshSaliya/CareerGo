<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        body {
            background-color: #f4f7fc;
        }
        .card {
            border: none;
            border-radius: 12px;
            padding: 30px;
        }
        .btn-custom {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
        }
        .btn-custom:hover {
            background-color: #0056b3;
        }
        .loading-box {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .loading-box img {
            width: 80px;
        }
        .feedback-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .feedback-box h3 {
            color: #007bff;
        }
        .feedback-list {
            text-align: left;
            padding: 0;
            list-style: none;
        }
        .feedback-list li {
            opacity: 0;
            animation: fadeIn 1s ease-in-out forwards;
            margin-bottom: 10px;
            font-size: 16px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-lg">
            <h2 class="text-center mb-4">Upload Your Resume for AI Analysis</h2>
            <form id="resumeForm" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Profession:</label>
                    <select name="profession" class="form-select" required>
                        <option value="Python Backend">Python Backend</option>
                        <option value="Frontend">Frontend</option>
                        <option value="Java Backend">Java Backend</option>
                        <option value="Data Science">Data Science</option>
                        <option value="PHP">PHP</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Experience Level:</label>
                    <select name="experience_level" class="form-select" required>
                        <option value="Fresher">Fresher</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Experienced">Experienced</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Upload Resume (PDF/DOCX):</label>
                    <input type="file" name="resume_file" class="form-control" accept=".pdf,.docx" required>
                </div>
                <button type="submit" class="btn btn-custom w-100">Upload & Analyze</button>
            </form>

            <!-- Loading Animation -->
            <div class="loading-box" id="loadingBox">
                <img src="https://i.gifer.com/ZZ5H.gif" alt="Loading">
                <p class="mt-2">AI is analyzing your resume... Please wait.</p>
            </div>

            <!-- Feedback Section -->
            <div class="feedback-box" id="feedbackBox">
                <h3 class="text-center" id="score"></h3>
                <ul class="feedback-list" id="feedbackList"></ul>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("resumeForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            let formData = new FormData(this);
            let loadingBox = document.getElementById("loadingBox");
            let feedbackBox = document.getElementById("feedbackBox");
            let scoreText = document.getElementById("score");
            let feedbackList = document.getElementById("feedbackList");

            // Reset UI
            loadingBox.style.display = "block";
            feedbackBox.style.display = "none";
            feedbackList.innerHTML = "";

            fetch("{% url 'process_resume' %}", {
                method: "POST",
                body: formData,
                headers: { "X-Requested-With": "XMLHttpRequest" }
            })
            .then(response => response.json())
            .then(data => {
                setTimeout(() => {
                    loadingBox.style.display = "none";
                    feedbackBox.style.display = "block";

                    if (data.error) {
                        feedbackBox.style.backgroundColor = "#ffdddd";
                        scoreText.innerText = "Error";
                        feedbackList.innerHTML = `<li style="color:red;">${data.error}</li>`;
                    } else {
                        feedbackBox.style.backgroundColor = "#e7f5ff";
                        scoreText.innerText = `Resume Score: ${data.score}/100`;

                        let feedbackArray = data.feedback.split("\n"); // Assuming feedback is a paragraph list

                        feedbackArray.forEach((text, index) => {
                            setTimeout(() => {
                                let li = document.createElement("li");
                                li.innerText = text;
                                li.style.animationDelay = `${index * 0.5}s`;
                                feedbackList.appendChild(li);
                            }, index * 500); // Smooth feedback appearance
                        });
                    }
                }, 5000); // Simulated AI analysis delay
            })
            .catch(error => console.error("Error:", error));
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
